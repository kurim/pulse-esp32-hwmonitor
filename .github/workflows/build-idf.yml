name: ESP-IDF Build
on:
  workflow_dispatch:
    inputs:
      esp_idf_version:
        # "latest" trackt den master-Branch von ESP-IDF (also den jeweils
        # neuesten, ggf. unfertigen Entwicklungsstand) - nicht das zuletzt
        # veroeffentlichte Release. Fuer reproduzierbare Builds daher fest
        # auf das letzte veroeffentlichte Release gepinnt (vX.Y = Release-Tag,
        # release-vX.Y wuerde stattdessen den Release-Branch inkl. Backports
        # tracken). Siehe hub.docker.com/r/espressif/idf/tags fuer neuere Tags.
        description: "ESP-IDF Docker-Image-Tag (siehe hub.docker.com/r/espressif/idf/tags)"
        required: true
        type: string
        default: v6.0.2
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Baut bei jedem Trigger (manuell wie per Tag-Push) immer alle drei
        # unterstuetzten/getesteten Zielchips, siehe README ("Building &
        # flashing" / Hinweis zu ESP32-S3/-C3). Ein einzelner Chip laesst
        # sich weiterhin lokal per "idf.py set-target <chip>" bauen.
        target: [esp32, esp32s3, esp32c3]
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v6

      # Bei Tag-Push (v1.0.0-idf, ...) FW_VERSION im Quellcode auf den Tag
      # setzen (ohne fuehrendes "v"), statt den in main/shared_state.h fest
      # eingetragenen Wert zu verwenden - bei manuellem workflow_dispatch
      # bleibt FW_VERSION aus dem Quellcode unveraendert.
      - name: FW_VERSION aus Tag setzen
        if: github.ref_type == 'tag'
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/#define FW_VERSION \".*\"/#define FW_VERSION \"${V}\"/" main/shared_state.h

      - name: Build + merge-bin
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ inputs.esp_idf_version || 'v6.0.2' }}
          target: ${{ matrix.target }}
          command: >-
            idf.py set-target ${{ matrix.target }} &&
            idf.py build &&
            idf.py merge-bin -o merged.bin --fill-flash-size 4MB

      - name: Flashbare Dateien benennen
        id: name
        run: |
          VERSION=$(grep -oP '(?<=FW_VERSION ")[0-9]+\.[0-9]+\.[0-9]+' main/shared_state.h)
          TARGET="${{ matrix.target }}"
          if [ "$TARGET" = "esp32" ]; then
            SUFFIX=""
          else
            SUFFIX="-${TARGET}"
          fi
          FNAME="esp32-hwmonitor-v${VERSION}-idf${SUFFIX}.bin"
          OTA_FNAME="esp32-hwmonitor-v${VERSION}-idf${SUFFIX}-ota.bin"
          mkdir -p dist
          # merged.bin: kompletter Flash-Inhalt (Bootloader+Partitionstabelle+
          # App) ab Offset 0x0 - zum initialen Flashen per esptool/USB.
          cp build/merged.bin "dist/${FNAME}"
          # esp32-hwmonitor.bin: nur das App-Image (~1.4 MB), passt in eine
          # OTA-Partition - das ist die Datei fuers Webportal-Update
          # (h_update() in main/net/web_portal.c schreibt den Request-Body 1:1
          # per esp_ota_write(), merged.bin ist dafuer zu gross/falsch
          # aufgebaut und liess sich dort nicht flashen).
          cp build/esp32-hwmonitor.bin "dist/${OTA_FNAME}"
          echo "fname=${FNAME}" >> "$GITHUB_OUTPUT"
          echo "ota_fname=${OTA_FNAME}" >> "$GITHUB_OUTPUT"

      - name: Firmware hochladen (Flash-Image)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.name.outputs.fname }}
          path: dist/${{ steps.name.outputs.fname }}
          if-no-files-found: error

      - name: Firmware hochladen (OTA-Image)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.name.outputs.ota_fname }}
          path: dist/${{ steps.name.outputs.ota_fname }}
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Firmware-Artefakte laden
        uses: actions/download-artifact@v6
        with:
          path: dist

      - name: GitHub-Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.bin
