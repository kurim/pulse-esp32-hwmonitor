name: PlatformIO Build
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Laedt einmalig die Pakete (Toolchains, Framework) fuer ALLE sieben Envs
  # herunter und speichert sie unter einem einzigen Cache-Key. Alle Envs
  # teilen sich dieselbe platform-URL und dieselben lib_deps aus [env] in
  # platformio.ini - nur board/build_flags unterscheiden sich, und die
  # beeinflussen ~/.platformio nicht. Vorher hatte jeder Matrix-Job seinen
  # eigenen Cache-Key (pio-<env>-...), wodurch z.B. die identische xtensa-
  # esp32-Toolchain dreifach (esp32/cyd/cyd-v3) und die identische xtensa-
  # esp32s3-Toolchain ebenfalls dreifach (esp32s3-4mb/-8mb/jc8048w550) im
  # Cache lag - das hat unnoetig viel vom 10-GB-Cache-Kontingent des Repos
  # belegt und aeltere Eintraege verdraengt. Cache-Keys sind unveraenderlich,
  # sobald geschrieben (siehe GitHub-Doku zu Dependency Caching) - liesse man
  # alle sieben Matrix-Jobs parallel unter demselben Key speichern, wuerde
  # der zuerst fertige Job den Key mit nur SEINEM (unvollstaendigen)
  # Paketset einfrieren. Deshalb: ein eigener Job baut den vollstaendigen
  # Cache VOR der Matrix auf, die Matrix-Jobs restaurieren ihn danach nur
  # noch (kein eigener Save mehr, kein Race um den Key).
  prime-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PlatformIO installieren
        run: pip install --upgrade platformio

      - name: PlatformIO-Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-

      # -e explizit fuer jeden Env, statt "pio pkg install" ohne Argument:
      # ohne -e greift PlatformIO auf [platformio] default_envs zurueck (hier
      # "cyd") und wuerde nur dessen Pakete laden, nicht die aller sieben.
      - name: Pakete fuer alle Envs vorladen
        if: steps.cache.outputs.cache-hit != 'true'
        run: >
          pio pkg install
          -e esp32 -e esp32s3-4mb -e esp32s3-8mb -e esp32c3
          -e cyd -e cyd-v3 -e jc8048w550

  build:
    needs: prime-cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Alle sieben Envs aus platformio.ini, nicht nur die drei Chip-
        # Familien: cyd/cyd-v3/jc8048w550 haben eigene Board-Flags (siehe
        # CLAUDE.md "Architektur"), esp32s3-4mb/-8mb unterscheiden sich in
        # Partitionstabelle/PSRAM-Modus/BLE (siehe Kommentare in
        # platformio.ini). Anders als beim alten ESP-IDF-Workflow braucht es
        # hier kein separates --fill-flash-size/Offset-Handling pro Eintrag -
        # das steckt für jeden Env bereits in platformio.ini
        # (board_build.partitions, board_upload.flash_size, ...) und pio
        # wendet es automatisch an.
        env:
          - esp32
          - esp32s3-4mb
          - esp32s3-8mb
          - esp32c3
          - cyd
          - cyd-v3
          - jc8048w550
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PlatformIO installieren
        run: pip install --upgrade platformio

      # Nur restore, kein save: der prime-cache-Job hat den vollstaendigen
      # Cache bereits geschrieben, bevor diese Matrix-Jobs starten (siehe
      # "needs" oben). Ein Save hier wuerde nur den bereits vorhandenen Key
      # erneut zu schreiben versuchen (No-Op) und unnoetig Cache-Traffic
      # erzeugen.
      - name: PlatformIO-Cache wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-

      # Bei Tag-Push (v1.0.0, ...) FW_VERSION im Quellcode auf den Tag setzen
      # (ohne fuehrendes "v"), statt den in src/config/shared_state.h fest
      # eingetragenen Wert zu verwenden - bei manuellem workflow_dispatch
      # bleibt FW_VERSION aus dem Quellcode unveraendert.
      - name: FW_VERSION aus Tag setzen
        if: github.ref_type == 'tag'
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/#define FW_VERSION \".*\"/#define FW_VERSION \"${V}\"/" src/config/shared_state.h

      - name: Build (${{ matrix.env }})
        run: pio run -e ${{ matrix.env }}

      - name: Flashbare Dateien benennen
        id: name
        run: |
          VERSION=$(grep -oP '(?<=FW_VERSION ")[0-9]+\.[0-9]+\.[0-9]+' src/config/shared_state.h)
          ENV="${{ matrix.env }}"
          BUILD_DIR=".pio/build/${ENV}"
          FNAME="esp32-hwmonitor-v${VERSION}-pio-${ENV}.bin"
          OTA_FNAME="esp32-hwmonitor-v${VERSION}-pio-${ENV}-ota.bin"
          mkdir -p dist
          # firmware.factory.bin: von pioarduino automatisch erzeugtes
          # Komplettimage (Bootloader+Partitionstabelle+otadata+App) ab
          # Offset 0x0 - zum initialen Flashen per esptool/USB, siehe
          # README "Building & flashing". Kein manuelles esptool merge_bin
          # noetig, das macht pioarduino selbst bei jedem Build.
          cp "$BUILD_DIR/firmware.factory.bin" "dist/${FNAME}"
          # firmware.bin: nur das App-Image, passt in eine OTA-Partition -
          # das ist die Datei fuers Webportal-Update (handleOtaUpload() in
          # src/network/web_portal.cpp schreibt den Request-Body 1:1 per
          # Update.write()); firmware.factory.bin ist dafuer zu gross/falsch
          # aufgebaut und liesse sich dort nicht flashen.
          cp "$BUILD_DIR/firmware.bin" "dist/${OTA_FNAME}"
          echo "fname=${FNAME}" >> "$GITHUB_OUTPUT"
          echo "ota_fname=${OTA_FNAME}" >> "$GITHUB_OUTPUT"

      - name: Firmware hochladen (Flash-Image)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.name.outputs.fname }}
          path: dist/${{ steps.name.outputs.fname }}
          if-no-files-found: error

      - name: Firmware hochladen (OTA-Image)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.name.outputs.ota_fname }}
          path: dist/${{ steps.name.outputs.ota_fname }}
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Firmware-Artefakte laden
        uses: actions/download-artifact@v6
        with:
          path: dist

      - name: GitHub-Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.bin

      # docs/ ist die GitHub-Pages-Seite mit dem Browser-Flasher
      # (docs/flasher.js). GitHub-Release-Assets liegen auf
      # release-assets.githubusercontent.com ohne
      # Access-Control-Allow-Origin - ein cross-origin fetch() von der
      # Pages-Seite aus schlaegt deshalb fuer esp-web-tools immer fehl,
      # egal ob per REST-API oder Redirect aufgeloest. Einzig
      # funktionierender Weg fuer einen reinen Browser-Flasher: die
      # Factory-Images liegen same-origin im Repo unter
      # docs/firmware/latest/, hier bei jedem Tag-Release aktuell gehalten.
      - name: Docs auschecken (platformio-Branch)
        uses: actions/checkout@v6
        with:
          ref: platformio
          path: docs-checkout

      - name: docs/firmware/latest/ aktualisieren und committen
        working-directory: docs-checkout
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          mkdir -p docs/firmware/latest
          rm -f docs/firmware/latest/*.bin
          for f in ../dist/*/esp32-hwmonitor-v${VERSION}-pio-*.bin; do
            base=$(basename "$f")
            case "$base" in *-ota.bin) continue ;; esac
            env_slug=${base#esp32-hwmonitor-v${VERSION}-pio-}
            env_slug=${env_slug%.bin}
            cp "$f" "docs/firmware/latest/esp32-hwmonitor-pio-${env_slug}.bin"
          done
          echo -n "$VERSION" > docs/firmware/latest/VERSION

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/firmware/latest
          if git diff --cached --quiet; then
            echo "Keine Aenderungen an docs/firmware/latest - nichts zu committen."
            exit 0
          fi
          git commit -m "docs: web flasher firmware auf v${VERSION} aktualisieren"
          git push origin HEAD:platformio
