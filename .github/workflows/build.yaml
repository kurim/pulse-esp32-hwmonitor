name: PlatformIO Build
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Alle sieben Envs aus platformio.ini, nicht nur die drei Chip-
        # Familien: cyd/cyd-v3/jc8048w550 haben eigene Board-Flags (siehe
        # CLAUDE.md "Architektur"), esp32s3-4mb/-8mb unterscheiden sich in
        # Partitionstabelle/PSRAM-Modus/BLE (siehe Kommentare in
        # platformio.ini). Anders als beim alten ESP-IDF-Workflow braucht es
        # hier kein separates --fill-flash-size/Offset-Handling pro Eintrag -
        # das steckt für jeden Env bereits in platformio.ini
        # (board_build.partitions, board_upload.flash_size, ...) und pio
        # wendet es automatisch an.
        env:
          - esp32
          - esp32s3-4mb
          - esp32s3-8mb
          - esp32c3
          - cyd
          - cyd-v3
          - jc8048w550
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PlatformIO installieren
        run: pip install --upgrade platformio

      # Toolchains (xtensa/riscv) und lib_deps (LVGL, ArduinoJson, ESPAsync-
      # WebServer, ...) sind pro Env mehrere hundert MB und sonst bei jedem
      # Lauf neu heruntergeladen - Cache-Key pro Env, damit die parallelen
      # Matrix-Jobs sich beim Schreiben nicht gegenseitig eine gemeinsame
      # Cache-Datei kaputt machen.
      - name: PlatformIO-Cache
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ matrix.env }}-

      # Bei Tag-Push (v1.0.0, ...) FW_VERSION im Quellcode auf den Tag setzen
      # (ohne fuehrendes "v"), statt den in src/config/shared_state.h fest
      # eingetragenen Wert zu verwenden - bei manuellem workflow_dispatch
      # bleibt FW_VERSION aus dem Quellcode unveraendert.
      - name: FW_VERSION aus Tag setzen
        if: github.ref_type == 'tag'
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/#define FW_VERSION \".*\"/#define FW_VERSION \"${V}\"/" src/config/shared_state.h

      - name: Build (${{ matrix.env }})
        run: pio run -e ${{ matrix.env }}

      - name: Flashbare Dateien benennen
        id: name
        run: |
          VERSION=$(grep -oP '(?<=FW_VERSION ")[0-9]+\.[0-9]+\.[0-9]+' src/config/shared_state.h)
          ENV="${{ matrix.env }}"
          BUILD_DIR=".pio/build/${ENV}"
          FNAME="esp32-hwmonitor-v${VERSION}-pio-${ENV}.bin"
          OTA_FNAME="esp32-hwmonitor-v${VERSION}-pio-${ENV}-ota.bin"
          mkdir -p dist
          # firmware.factory.bin: von pioarduino automatisch erzeugtes
          # Komplettimage (Bootloader+Partitionstabelle+otadata+App) ab
          # Offset 0x0 - zum initialen Flashen per esptool/USB, siehe
          # README "Building & flashing". Kein manuelles esptool merge_bin
          # noetig, das macht pioarduino selbst bei jedem Build.
          cp "$BUILD_DIR/firmware.factory.bin" "dist/${FNAME}"
          # firmware.bin: nur das App-Image, passt in eine OTA-Partition -
          # das ist die Datei fuers Webportal-Update (handleOtaUpload() in
          # src/network/web_portal.cpp schreibt den Request-Body 1:1 per
          # Update.write()); firmware.factory.bin ist dafuer zu gross/falsch
          # aufgebaut und liesse sich dort nicht flashen.
          cp "$BUILD_DIR/firmware.bin" "dist/${OTA_FNAME}"
          echo "fname=${FNAME}" >> "$GITHUB_OUTPUT"
          echo "ota_fname=${OTA_FNAME}" >> "$GITHUB_OUTPUT"

      - name: Firmware hochladen (Flash-Image)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.name.outputs.fname }}
          path: dist/${{ steps.name.outputs.fname }}
          if-no-files-found: error

      - name: Firmware hochladen (OTA-Image)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.name.outputs.ota_fname }}
          path: dist/${{ steps.name.outputs.ota_fname }}
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Firmware-Artefakte laden
        uses: actions/download-artifact@v6
        with:
          path: dist

      - name: GitHub-Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.bin
