# Managed Components (werden von idf.py automatisch aus dem ESP Component
# Registry geladen und dem 'main'-Component als Abhaengigkeit hinzugefuegt -
# daher NICHT zusaetzlich in main/CMakeLists.txt REQUIRES auffuehren).
#
# Ab ESP-IDF v6.0 sind esp-mqtt und cJSON nicht mehr im Core, sondern
# managed components (espressif/mqtt bzw. espressif/cjson).
dependencies:
  idf: ">=5.1"
  lvgl/lvgl: "^9"
  espressif/esp_lvgl_port: "^2"
  # esp_lcd_ili9341 >= 2.0.0 unterstuetzt ESP-IDF 6.0 (rgb_ele_order); die
  # 1.x-Reihe nutzt noch das in v6 entfernte rgb_endian und bricht dort ab.
  espressif/esp_lcd_ili9341: "^2"
  # Weitere Panel-Treiber fuer die Displayauswahl im Webportal (siehe
  # board_profiles.h). Komponentennamen folgen der ueblichen Espressif-
  # Konvention, sind aber NOCH NICHT auf Hardware verifiziert - falls
  # `idf.py build` eine dieser Abhaengigkeiten nicht auflösen kann, den
  # exakten Namen im ESP Component Registry (https://components.espressif.com)
  # nachschlagen und hier korrigieren.
  espressif/esp_lcd_ili9488: "*"
  espressif/esp_lcd_st7796: "^1"
  espressif/esp_lcd_gc9a01: "^2"
  espressif/esp_lcd_panel_ssd1306: "^1" # SSD1309 nutzt dasselbe Protokoll wie SSD1306
  espressif/mqtt: "*"
  espressif/cjson: "*"
