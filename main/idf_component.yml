# Managed Components (werden von idf.py automatisch aus dem ESP Component
# Registry geladen und dem 'main'-Component als Abhaengigkeit hinzugefuegt -
# daher NICHT zusaetzlich in main/CMakeLists.txt REQUIRES auffuehren).
#
# Ab ESP-IDF v6.0 sind esp-mqtt und cJSON nicht mehr im Core, sondern
# managed components (espressif/mqtt bzw. espressif/cjson).
dependencies:
  idf: ">=5.1"
  lvgl/lvgl: "^9"
  espressif/esp_lvgl_port: "^2"
  # esp_lcd_ili9341 >= 2.0.0 unterstuetzt ESP-IDF 6.0 (rgb_ele_order); die
  # 1.x-Reihe nutzt noch das in v6 entfernte rgb_endian und bricht dort ab.
  espressif/esp_lcd_ili9341: "^2"
  # Weitere Panel-Treiber fuer die Displayauswahl im Webportal (siehe
  # board_profiles.h).
  #
  # ILI9488: kein offizieller espressif/-Namespace-Eintrag im Registry -
  # atanisoft/esp_lcd_ili9488 ist der gaengige Community-Treiber (Header
  # esp_lcd_ili9488.h, Funktion esp_lcd_new_panel_ili9488() mit zusaetzlichem
  # buffer_size-Parameter fuer die interne RGB565->RGB666-Konvertierung).
  # WICHTIG: mindestens 1.1.0 - erst ab da unterstuetzt der Treiber
  # ESP-IDF>=6.0 (rgb_ele_order statt des in 6.0 entfernten color_space-Felds/
  # ESP_LCD_COLOR_SPACE_*-Enums). "~1.0.0" (nur 1.0.x) fuehrte auf ESP-IDF
  # 6.0.2 zu Compile-Fehlern ("has no member named 'color_space'").
  atanisoft/esp_lcd_ili9488: "^1.1.0"
  espressif/esp_lcd_st7796: "^1"
  espressif/esp_lcd_gc9a01: "^2"
  # GT911-Kapazitiv-Touch fuers Guition JC8048W550 (RGB-Parallel-Profil,
  # display_ui.c: lcd_init_rgb()/touch_gt911.c). esp_lcd_touch ist die
  # Basis-Abstraktion (esp_lcd_touch_handle_t/esp_lcd_touch_read_data/...),
  # von esp_lcd_touch_gt911 zwar bereits als eigene Abhaengigkeit gezogen,
  # hier aber zusaetzlich explizit aufgefuehrt, da touch_gt911.h/.c sie direkt
  # einbinden.
  espressif/esp_lcd_touch: "^1"
  espressif/esp_lcd_touch_gt911: "^1"
  # SSD1306/SSD1309 sind bereits Teil des Core-esp_lcd-Components
  # (esp_lcd_panel_vendor.h -> esp_lcd_panel_ssd1306.h, esp_lcd_new_panel_ssd1306()),
  # brauchen daher KEINEN separaten Registry-Eintrag - anders als hier zuvor
  # angenommen ("espressif/esp_lcd_panel_ssd1306" existiert nicht und liess
  # den Build mit "Version solving failed" abbrechen).
  espressif/mqtt: "*"
  espressif/cjson: "*"
