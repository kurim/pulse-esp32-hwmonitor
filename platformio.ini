; PlatformIO / pioarduino project file for the Arduino-framework rewrite of the
; ESP32 hardware monitor firmware (see ../esp-idf branch for the pure ESP-IDF
; reference implementation this is ported from).

[platformio]
default_envs = esp32

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
; alexhopeoconnor/WiFiManager v2.0.19 (pinned tag, not tzapu/WiFiManager
; upstream): this is a genuine rewrite, not the earlier-evaluated commit that
; turned out byte-identical to upstream - WiFiManager.cpp is now split into
; 5 files under lib/WiFiManager/ and rebuilt natively on ESPAsyncWebServer
; instead of the classic blocking WebServer. Confirmed breaking API change:
; setConfigPortalBlocking() is gone entirely - non-blocking is now the only
; mode (verified in autoConnect()/startConfigPortal(): both return without
; waiting for the portal to finish), so web_portal.cpp simply no longer
; calls it, nothing replaces it. Pulls in a new transitive dependency,
; alexhopeoconnor/DFTE (its own template engine, v1.0.0, no tags yet -
; pinned to a commit below since there's nothing else to pin to) and raises
; the minimum ESPAsyncWebServer version to 3.9.1.
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    lvgl/lvgl@^9
    lovyan03/LovyanGFX
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2
    ESP32Async/ESPAsyncWebServer@^3.9.1
    ESP32Async/AsyncTCP@^3
    https://github.com/alexhopeoconnor/WiFiManager.git#v2.0.19
    https://github.com/alexhopeoconnor/DFTE.git#9e998f92a2caa7e007e18aeb460b2dcd2e0d32f7

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
; Octal-PSRAM fuer den Guition JC8048W550 (dual RGB-Framebuffer, ~1.5MB) -
; exakter Wert wird in Migrations-Phase 3 gegen echte Hardware verifiziert.
board_build.arduino.memory_type = qio_opi

[env:esp32c3]
board = esp32-c3-devkitm-1
