; PlatformIO / pioarduino project file for the Arduino-framework rewrite of the
; ESP32 hardware monitor firmware (see ../esp-idf branch for the pure ESP-IDF
; reference implementation this is ported from).

[platformio]
default_envs = esp32

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
; Zurueck auf tzapu/WiFiManager (Registry-Paket) statt des
; alexhopeoconnor/WiFiManager-Forks: Ein Vergleich des Forks am gepinnten
; Commit (32655b722601ce8bf3c03974bac06a96ceed42e2) gegen tzapu/WiFiManager
; 2.0.17 zeigte identischen Code (WiFiManager.cpp dort byte-fuer-byte gleich
; gross, 4053 Zeilen wie im Original) - der Fork brachte an dieser Stelle
; also ohnehin nichts anderes. Trotz explizitem Commit-Pin (statt Branch)
; lieferte "pio run" bei realen Builds nicht-deterministische Programmgroessen
; (mal ~1.98 MB, mal ~2.12 MB bei unveraendertem Quellcode) - ein Indiz, dass
; die Git-URL+Commit-Pin-Aufloesung nicht zuverlaessig auf den gepinnten
; Commit greift (vermutlich ein Cache-Problem jenseits von .pio/libdeps).
; Das Registry-Paket liefert denselben Code deterministisch, ohne dieses
; Risiko - daher zurueckgewechselt.
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    lvgl/lvgl@^9
    lovyan03/LovyanGFX
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2
    ESP32Async/ESPAsyncWebServer@^3
    ESP32Async/AsyncTCP@^3
    tzapu/WiFiManager@^2.0.17

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
; Octal-PSRAM fuer den Guition JC8048W550 (dual RGB-Framebuffer, ~1.5MB) -
; exakter Wert wird in Migrations-Phase 3 gegen echte Hardware verifiziert.
board_build.arduino.memory_type = qio_opi

[env:esp32c3]
board = esp32-c3-devkitm-1
