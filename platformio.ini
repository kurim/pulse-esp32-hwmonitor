; PlatformIO / pioarduino project file for the Arduino-framework rewrite of the
; ESP32 hardware monitor firmware (see ../esp-idf branch for the pure ESP-IDF
; reference implementation this is ported from).

[platformio]
default_envs = esp32

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    lvgl/lvgl@^9
    lovyan03/LovyanGFX@^1
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2
    ESP32Async/ESPAsyncWebServer@^3
    ESP32Async/AsyncTCP@^3

[env:esp32]
board = esp32dev

; Isolierter TFT_eSPI-Vergleichstest fuer die CYD-Rauschfehlersuche - siehe
; src/tft_espi_noise_test.cpp. Ersetzt setup()/loop() komplett (kein LVGL/
; WLAN/App-Code), nutzt die bekannte ESP32-2432S028-Pinbelegung. Aufruf:
; "pio run -e esp32_tftespi_test -t upload -t monitor". Nach der
; Fehlersuche wieder entfernen.
[env:esp32_tftespi_test]
board = esp32dev
build_flags =
    -DTFT_ESPI_NOISE_TEST=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
; Nur main.cpp (setup()/loop() dort per #ifndef ausgeblendet) und den
; Testcode selbst kompilieren - der restliche App-Code (display/, net/,
; config_store.cpp, ...) wird fuer diesen isolierten Test nicht gebraucht.
build_src_filter =
    +<main.cpp>
    +<tft_espi_noise_test.cpp>

[env:esp32s3]
board = esp32-s3-devkitc-1
; Octal-PSRAM fuer den Guition JC8048W550 (dual RGB-Framebuffer, ~1.5MB) -
; exakter Wert wird in Migrations-Phase 3 gegen echte Hardware verifiziert.
board_build.arduino.memory_type = qio_opi

[env:esp32c3]
board = esp32-c3-devkitm-1
