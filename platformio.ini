; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = cyd

[ui_mono]
build_flags = 
	-DUI_MONO
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_CONF_PATH_MONO

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:extra_script_gzip_web.py
board_build.partitions = partitions_4mb.csv
board_build.embed_files =
	web/dashboard.html.gz
	web/favicon.svg.gz
; AsyncTCP registriert seinen eigenen Task beim ESP-IDF Task-Watchdog und
; erwartet, ihn regelmaessig selbst zu fuettern (siehe AsyncTCP.cpp). Der
; IDF-Default (5s) ist zu knapp, sobald loop() (LVGL-Refresh, WiFi/MQTT-
; Handling) den async_tcp-Task laenger von der CPU fernhaelt als er
; ungenutzt sein darf - fuehrt sonst zu "Task watchdog got triggered ...
; async_tcp" und Reboot, seit web_portal_begin() den Server dauerhaft
; laufen laesst statt nur im Captive-Portal-Fallback.
board_build.custom_sdkconfig =
	CONFIG_ESP_TASK_WDT_TIMEOUT_S=60
build_flags =
	-DCORE_DEBUG_LEVEL=2
	-DLV_CONF_INCLUDE_SIMPLE
	-Iinclude
	-Isrc
	-Isrc/config
	-Isrc/network
	-Isrc/fonts

lib_ldf_mode=deep
lib_deps = 
	lvgl/lvgl@^9
	moononournation/GFX Library for Arduino@^1.6
	bblanchon/ArduinoJson@^7
	bertmelis/espMqttClient@^1.7
	ESP32Async/ESPAsyncWebServer@^3
	ESP32Async/AsyncTCP@^3
	https://github.com/mhaberler/Improv-WiFi-Library.git
	martinverges/ESP32 Wifi Manager@^1.5.0
	Networking
; XPT2046_Bitbang_Slim war spuerbar traege (Bit-Banging via digitalWrite/
; digitalRead in einer Schleife ist inhaerent langsamer als ein Hardware-SPI-
; Peripheral) - zurueck auf Hardware-SPI mit der Original-Bibliothek von
; PaulStoffregen. Per Git-URL statt PlatformIO-Registry-Eintrag: die dortige
; Version ist ein 0.0.0-alpha-Tag, ein Versions-Constraint wie @^1.4 matcht
; das nicht und die Registry-Suche landete sonst bei einem falschen
; gleichnamigen Fork (der wiederum eine ungenutzte Adafruit_GFX-
; Transitivabhaengigkeit mitzieht).
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
; GT911 (JC8048W550) - Original-Register-Sondierung von Hand (fixe I2C-
; Adresse 0x5D, RST/INT manuell fuer die Adresswahl getoggelt) hat auf
; echter Hardware nicht funktioniert. Diese Bibliothek probiert beide
; moeglichen Adressen (0x5D/0x14) per echtem Register-Read statt eine davon
; fest anzunehmen, und laesst RST/INT unangetastet (siehe deren eigener
; Kommentar zu genau dieser ESP32-S3-Falle) - vermutlich exakt der Grund,
; warum die Handimplementierung schwieg.
	https://github.com/tonywestonuk/gt911-arduino.git

[env:esp32]
board = esp32dev
; Boards ohne PSRAM (dieser Env, cyd_base, esp32c3): der TLS-Handshake fuer
; GitHub-FOTA (github_ota.cpp) ist der erste HTTPS-Codepfad im Projekt - der
; mbedTLS-Default reserviert 16 KB Ein- + 16 KB Ausgabepuffer PRO Session,
; und auf echter Hardware (CYD) schlug die Zertifikatsverarbeitung waehrend
; des Handshakes reproduzierbar mit "X509"/"BIGNUM - Allocation of memory
; failed" (mbedtls -10368) fehl, weil daneben schon LVGL/MQTT/AsyncWebServer/
; WiFiManager um denselben internen SRAM konkurrieren (live gemessen: nur
; ~78 KB frei, davon nur ~36 KB in einem Block, direkt nach dem Boot - kein
; Fragmentierungseffekt durch Laufzeit, das ist der strukturelle Bestwert).
; KEEP_PEER_CERTIFICATE=n verhindert, dass mbedTLS die komplette Zertifikat-
; kette (GitHub: 2-3 Zertifikate) gleichzeitig im Speicher haelt statt jedes
; Zertifikat nach Gebrauch sofort wieder freizugeben - gebraucht wird die
; Kette hier ohnehin nicht (setInsecure() in github_ota.cpp verifiziert
; nicht dagegen). Boards mit PSRAM (esp32s3-*, jc8048w550) sind nicht
; betroffen und bleiben unangetastet.
board_build.custom_sdkconfig =
	${env.board_build.custom_sdkconfig}
	CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
	CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=6144
	CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048
	CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE=n
build_flags =
	${env.build_flags}
	-DBOARD_GENERIC
	-DFW_OTA_ENV_SLUG=\"esp32\"

[esp32s3_base]
board = esp32-s3-devkitc-1
build_flags =
	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_GENERIC

; Zwei Envs statt einem "esp32s3": S3-Boards unterscheiden sich stark in
; Flash-/PSRAM-Ausstattung (z.B. ESP32-S3-Zero: ESP32-S3FH4R2, 4 MB Quad-Flash
; + 2 MB Quad-PSRAM, vs. ein esp32-s3-devkitc-1 mit 8 MB Flash + Octal-PSRAM) -
; ein gemeinsamer Env mit partitions_4mb.csv liess das grosse S3-Firmwareimage
; (Dual-OTA + Coredump-Partition, siehe partitions_4mb.csv) knapp ueberlaufen
; (~8 KB zu gross auf 4 MB). Aufgeteilt statt eines pauschalen Flags, weil auch
; der PSRAM-Modus (qio_qspi vs. qio_opi) und die Partitionstabelle je nach
; Flash-Groesse unterschiedlich sind, nicht nur die BLE-Frage unten.
[env:esp32s3-4mb]
extends = esp32s3_base
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions_4mb.csv
board_upload.flash_size = 4MB
build_flags =
	${esp32s3_base.build_flags}
	-DBOARD_HAS_PSRAM
	-DFW_OTA_ENV_SLUG=\"esp32s3-4mb\"
; IMPROV_WIFI_BLE_ENABLED bewusst NICHT aktiv: der BLE-Stack kostet deutlich
; mehr Flash als die paar KB, die hier ueberhaupt noch fehlten - und anders als
; bei der Partitionstabelle (Dual-OTA + Coredump-Partition sind bewusste
; Architekturentscheidungen, siehe CLAUDE.md) ist BLE-Provisioning nur ein
; ZWEITER Weg neben dem ohnehin vorhandenen Web-Portal-AP, kein Funktionsverlust
; also, nur ein Weg weniger dahin.

[env:esp32s3-8mb]
extends = esp32s3_base
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_8mb.csv
build_flags =
	${esp32s3_base.build_flags}
	-DIMPROV_WIFI_BLE_ENABLED
	-DFW_OTA_ENV_SLUG=\"esp32s3-8mb\"

[env:esp32c3]
board = esp32-c3-devkitm-1
; Kein PSRAM (siehe CLAUDE.md) - gleicher TLS-Heap-Engpass wie [env:esp32]
; oben, siehe dortiger Kommentar.
board_build.custom_sdkconfig =
	${env.board_build.custom_sdkconfig}
	CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
	CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=6144
	CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048
	CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE=n
build_flags =
	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_GENERIC
	-DFW_OTA_ENV_SLUG=\"esp32c3\"

[cyd_base]
board = esp32dev
; Kein PSRAM (siehe CLAUDE.md) - gleicher TLS-Heap-Engpass wie [env:esp32]
; oben, siehe dortiger Kommentar. Hier live beobachtet: mbedtls -10368
; "X509"/"BIGNUM - Allocation of memory failed" waehrend des GitHub-FOTA-
; Handshakes, reproduzierbar auch direkt nach einem frischen Boot.
board_build.custom_sdkconfig =
	${env.board_build.custom_sdkconfig}
	CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
	CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=6144
	CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048
	CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE=n
build_flags =
	${env.build_flags}
	-DBOARD_CYD_2432S028R
	-DBOARD_CYD=1
	-DCYD_BL_PIN=21

[env:cyd]
extends = cyd_base
build_flags =
	${cyd_base.build_flags}
	-DFW_OTA_ENV_SLUG=\"cyd\"

[env:cyd-v3]
extends = cyd_base
build_flags =
	${cyd_base.build_flags}
	-DCYD_DISPLAY_ST7789=1
	-DCYD_INVERT_COLORS=1
	-DFW_OTA_ENV_SLUG=\"cyd-v3\"

[env:jc8048w550]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_16mb.csv
board_build.custom_sdkconfig =
	${env.board_build.custom_sdkconfig}
	CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
	CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
	CONFIG_SPIRAM_RODATA=y
build_flags =
	${env.build_flags}
	-DBOARD_JC8048W550
	-DBOARD_HAS_PSRAM
	-DIMPROV_WIFI_BLE_ENABLED
	-DFW_OTA_ENV_SLUG=\"jc8048w550\"
