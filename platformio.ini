; PlatformIO / pioarduino project file for the Arduino-framework rewrite of the
; ESP32 hardware monitor firmware (see ../esp-idf branch for the pure ESP-IDF
; reference implementation this is ported from).

[platformio]
default_envs = esp32

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
; alexhopeoconnor/WiFiManager statt des tzapu/WiFiManager-Originals (siehe
; lib_deps unten) - weiterentwickelter Fork, dessen eigenes Repo aber explizit
; warnt "not a drop-in replacement... assume core web-portal architecture has
; changed... review the code before adopting". Zum Zeitpunkt des unten
; gepinnten Commits (master-HEAD) ist die von uns genutzte API (autoConnect(),
; setConfigPortalBlocking(), process(), getConfigPortalActive(),
; resetSettings()) noch 1:1 identisch zu tzapu/WiFiManager 2.0.17 (einziger
; Unterschied: interne Auswahl der Sprach-Strings-Header, WM_STRINGS_FILE
; statt LANG_XX-Defines, ohne Auswirkung ohne eigene Uebersetzung) - trotzdem
; bewusst auf einen festen Commit gepinnt statt auf den Branch, damit ein
; kuenftiger Breaking-Change dort nicht unbemerkt beim naechsten "pio run"
; mitgezogen wird.
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    lvgl/lvgl@^9
    lovyan03/LovyanGFX
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2
    ESP32Async/ESPAsyncWebServer@^3
    ESP32Async/AsyncTCP@^3
    https://github.com/alexhopeoconnor/WiFiManager.git#32655b722601ce8bf3c03974bac06a96ceed42e2

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
; Octal-PSRAM fuer den Guition JC8048W550 (dual RGB-Framebuffer, ~1.5MB) -
; exakter Wert wird in Migrations-Phase 3 gegen echte Hardware verifiziert.
board_build.arduino.memory_type = qio_opi

[env:esp32c3]
board = esp32-c3-devkitm-1
