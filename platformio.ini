; PlatformIO / pioarduino project file for the Arduino-framework rewrite of the
; ESP32 hardware monitor firmware (see ../esp-idf branch for the pure ESP-IDF
; reference implementation this is ported from).

[platformio]
default_envs = esp32

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    lvgl/lvgl@^9
    ; Der eigentliche Fix fuer das grossflaechige CYD-Rauschen war, in
    ; disp_flush_cb() (display_ui.cpp) pushImage() statt des manuellen
    ; setAddrWindow()+writePixels()-Paars zu nutzen - writePixels() zeigte
    ; auf echter Hardware Rauschen unabhaengig von Puffergroesse/DMA/
    ; Aufrufanzahl, pushImage() blieb durchgehend sauber. Auf dem develop-
    ; Branch verifiziert und deshalb auf den getesteten Commit gepinnt
    ; (reproduzierbar, kein sich bewegender Branch). Ob der ^1-Release
    ; ebenfalls funktioniert (d.h. ob es wirklich am pushImage()-Fix statt
    ; an einer zwischenzeitlichen Bugfix-Version lag), ist noch nicht separat
    ; getestet - bei Gelegenheit gegen "lovyan03/LovyanGFX@^1" pruefen.
    https://github.com/lovyan03/LovyanGFX.git#ed6b7907258ec2557dcab472abaef73dd9851017
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2
    ESP32Async/ESPAsyncWebServer@^3
    ESP32Async/AsyncTCP@^3

[env:esp32]
board = esp32dev

; Isolierter Minimal-Test: LVGL9 + LovyanGFX (LGFX_CYD), NUR ein Label mit
; Sekunden-Timer, komplett ohne den restlichen Dashboard-Code (WLAN/MQTT/
; Wetter/mehrere Screens/Charts). Trennt "LVGL9-Verdrahtung an sich kaputt"
; von "irgendwas in der komplexen App-UI blockiert Updates" - das offizielle
; LovyanGFX-Demo (LVGL8) laeuft auf derselben Hardware nachweislich
; einwandfrei durchgehend, unser LVGL9-Dashboard aktualisiert sich dagegen
; nach dem ersten Rendern nie wieder. Aufruf:
; "pio run -e esp32_lvgl9_min_test -t upload -t monitor". Nach der
; Fehlersuche wieder entfernen.
[env:esp32_lvgl9_min_test]
board = esp32dev
build_flags =
    -DLVGL9_MIN_TEST=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    lvgl/lvgl@^9
    https://github.com/lovyan03/LovyanGFX.git#ed6b7907258ec2557dcab472abaef73dd9851017
build_src_filter =
    +<main.cpp>
    +<lvgl9_min_test.cpp>

[env:esp32s3]
board = esp32-s3-devkitc-1
; Octal-PSRAM fuer den Guition JC8048W550 (dual RGB-Framebuffer, ~1.5MB) -
; exakter Wert wird in Migrations-Phase 3 gegen echte Hardware verifiziert.
board_build.arduino.memory_type = qio_opi

[env:esp32c3]
board = esp32-c3-devkitm-1
